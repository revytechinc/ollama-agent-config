# ollama-agent-config — exact-match so curl gets text/plain, not HTML or octet-stream
location = /install-ollama-agent-config.sh {
    alias /usr/local/www/install/install-ollama-agent-config.sh;
    types { }
    default_type text/plain;
    charset utf-8;
    add_header X-Content-Type-Options nosniff;
    add_header Cache-Control "no-cache";
}
location = /install-ollama-agent-config.sh.sha256 {
    alias /usr/local/www/install/install-ollama-agent-config.sh.sha256;
    types { }
    default_type text/plain;
    charset utf-8;
    add_header X-Content-Type-Options nosniff;
    add_header Cache-Control "no-cache";
}
